name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "NeonVideoEditor-AndroidStudio.zip" ]; then
            echo "Project ZIP missing. Upload NeonVideoEditor-AndroidStudio.zip to the repository root."
            exit 1
          fi

          unzip -q "NeonVideoEditor-AndroidStudio.zip" -d source

          test -f "source/NeonVideoEditor/settings.gradle.kts"
          test -f "source/NeonVideoEditor/app/build.gradle.kts"

      - name: Build debug APK
        working-directory: source/NeonVideoEditor
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonVideoEditor-debug-APK
          path: source/NeonVideoEditor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
